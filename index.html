<!DOCTYPE html>
<html>
<head>
      <title>Next Self</title>
<style>

body{
      font-family:Arial,sans-serif;
      background:#f7f3f0;
      color:#333;
      text-aligh: center;
      margin: 0;
      padding: 40px;
}

       h1 { 
             font-size: 40px;
             margin-botton: 10px;
       }
       p  {
             font-size: 18px;
             color: #777;
       } .habit-card{
             background: white;
             max-width: 400px;
             margin: 30x auto;
             padding: 25px;
             border-radius: 20px;
             box-shadow: 0 8px 25px rgba(0, 0,
       0, 0.08);
       }
       .habit-card h2  {
            margin-button: 10px;
       {

             habit-card button  {
                   background: #8fbc8f;
                   color: white;
                   border: none;
                   padding: 12px 25px;
                   border-radius: 12px;
                   font-size: 16px;
                   cursor: pointer;
</style>
</head>

<body>
      <h1>Next Self  🍀 </h1>

      <p> become better version of yourself every day .</p>

<div class="habit-card">
       <h2>📚  Study</h2>
       <p>complete your daily study session</p>

       <button>✓ Done</button>
</div> 
<button id="addHabitBtn">+ Add Habit</button>
      <div id="habitList"></div>
      
<script>
      
const addHabitBtn =
document.getElementById("addHabitBtn");
      
      addHabitBtn.oneclick = function()  {        
                const habitName = prompt("🍀what habit do you want to add?");
      
      if (habitName)  { 

            const habit =
document.createElement("div");
            habit .className = "habit-card";

            habit.innerHTML = `
                  <h2>☘️ ${habitName}</h2>
                  <p>complete this habit today</p>
            <button onclick="this.innerText=`✓
 Done`">° Done</button>
            `;

            habitList.appendChild(habit);
      }
}; 
      
</script>  
      
</body>
</html>
